<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ScrapLab</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #F8F3EA;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .wrap {
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 16px;
    border: 3px solid #E8DFCF;
    border-top-color: #F97316;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #6B5B4A; font-size: 14px; margin: 4px 0; }
  button {
    margin-top: 16px;
    padding: 10px 20px;
    border-radius: 999px;
    border: none;
    background: #F97316;
    color: white;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p id="status">Connecting to ScrapLab…</p>
    <button id="retry" style="display:none">Retry</button>
  </div>
  <script>
    // Keep in sync with PRODUCTION_URL in capacitor.config.ts.
    var PRODUCTION_URL = 'https://scraplab-inky.vercel.app/';

    // Capacitor lands here via server.errorPath when a navigation to
    // server.url fails (offline, DNS failure, cold start timeout, 5xx). The
    // native bridge is injected on this origin too, so dismiss the launch
    // splash ourselves rather than leaving it over an error page the user
    // can't tap. Capacitor.Plugins is empty here — it's populated by
    // registerPlugin() in the web bundle, which this standalone page doesn't
    // load — so go through the bridge's low-level call instead.
    try {
      window.Capacitor.nativePromise('SplashScreen', 'hide', {}).catch(function () {});
    } catch (e) {
      // Not running inside the native shell.
    }

    document.getElementById('retry').addEventListener('click', function () {
      // A plain reload would just reload this local page. Navigate at the real
      // app instead — the host is in allowNavigation, so it stays in-webview.
      window.location.replace(PRODUCTION_URL);
    });

    // We only get here after a load has already failed, so there's nothing
    // left to wait on — just long enough to avoid a flash of "Could not
    // reach ScrapLab" when a retry succeeds immediately.
    setTimeout(function () {
      document.getElementById('status').textContent = 'Could not reach ScrapLab.';
      document.getElementById('retry').style.display = 'inline-block';
    }, 1500);
  </script>
</body>
</html>
