name: ScrapLab
options:
  bundleIdPrefix: com.scraplab
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  ScrapLabCore:
    path: Packages/ScrapLabCore
settings:
  base:
    DEVELOPMENT_TEAM: 6PA43G2WVX
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  ScrapLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: ScrapLab
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Baloo2-Variable.ttf
          - Inter-Variable.ttf
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.scraplab.app
            CFBundleURLSchemes:
              - scraplab
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: ScrapLab uses your camera to identify craft materials you have at home, so it can suggest what you can build with them.
        NSPhotoLibraryUsageDescription: ScrapLab uses photos you choose to identify craft materials and suggest what you can build with them.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scraplab.app
        PRODUCT_NAME: ScrapLab
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ScrapLabCore
        product: ScrapLabModels
      - package: ScrapLabCore
        product: ScrapLabAPI
    scheme:
      gatherCoverageData: true
      testTargets:
        - ScrapLabTests
  ScrapLabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScrapLab
