name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit/API tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          GOOGLE_AI_API_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_PLUS_PRICE_ID: price_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder

  # Runs the Playwright smoke suite against a real staging deployment.
  # Placeholder Supabase credentials (used by the `check` job's build step
  # above) can't serve real activities/recommendation data, so this job
  # only runs once STAGING_URL is configured as a repo secret — it's a
  # no-op otherwise rather than a false-green check against fake data.
  # TEST_USER_EMAIL/TEST_USER_PASSWORD are optional: without them the
  # authenticated specs skip themselves, per each spec's own test.skip().
  e2e:
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: E2E smoke tests against staging
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_PROJECT_ID: ${{ vars.TEST_PROJECT_ID }}
